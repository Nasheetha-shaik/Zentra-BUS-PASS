<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Zentra University Transport</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-container {
      max-width: 560px;
      margin: 3rem auto;
      padding: 0 1.25rem;
    }
    .auth-tabs {
      display: flex;
      background: var(--bg-subtle);
      padding: 0.35rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-color);
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 0.55rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: none;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .auth-tab.active {
      background: #ffffff;
      color: var(--primary-navy);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>

  <!-- Site Navigation Header -->
  <header class="site-header"></header>

  <div class="auth-container">
    <div class="card" style="box-shadow: var(--shadow-lg);">
      <div class="card-body" style="padding: 2.25rem 2rem;">
        
        <div style="text-align: center; margin-bottom: 1.75rem;">
          <h2 style="color: var(--primary-navy); font-weight: 800; font-size: 1.6rem;">Create Zentra Account</h2>
          <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.25rem;">Register to apply for your university bus pass</p>
        </div>

        <!-- Role Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-role="STUDENT" onclick="setSignupType('STUDENT')">Student Registration</button>
          <button class="auth-tab" data-role="EMPLOYEE" onclick="setSignupType('EMPLOYEE')">Faculty & Employee</button>
        </div>

        <!-- Signup Form -->
        <form onsubmit="handleSignupSubmit(event)">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" class="form-control" id="signupName" placeholder="e.g. John Doe" required>
              <span class="form-error" id="signupNameError"></span>
            </div>

            <div class="form-group">
              <label class="form-label" id="signupIdLabel">Registration ID *</label>
              <input type="text" class="form-control" id="signupId" placeholder="e.g. 24BCE1999" required>
              <span class="form-error" id="signupIdError"></span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">University Email *</label>
              <input type="email" class="form-control" id="signupEmail" placeholder="e.g. student@univ.edu" required>
              <span class="form-error" id="signupEmailError"></span>
            </div>

            <div class="form-group">
              <label class="form-label">Phone Number (10 digits) *</label>
              <input type="tel" class="form-control" id="signupPhone" placeholder="9876543210" required>
              <span class="form-error" id="signupPhoneError"></span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Department / School *</label>
            <select class="form-control" id="signupDepartment" required>
              <option value="">-- Select Department --</option>
              <option value="Computer Science & Engineering">Computer Science & Engineering</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electronics & Communication">Electronics & Communication</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Civil Engineering">Civil Engineering</option>
              <option value="Physics & Applied Sciences">Physics & Applied Sciences</option>
              <option value="Management Studies">Management Studies</option>
              <option value="University Administration">University Administration</option>
            </select>
            <span class="form-error" id="signupDepartmentError"></span>
          </div>

          <!-- Student Only Year Selection -->
          <div class="form-group" id="studentOnlyFields">
            <label class="form-label">Academic Year *</label>
            <select class="form-control" id="signupYear">
              <option value="">-- Select Year of Study --</option>
              <option value="1st Year">1st Year (Freshman)</option>
              <option value="2nd Year">2nd Year (Sophomore)</option>
              <option value="3rd Year">3rd Year (Junior)</option>
              <option value="4th Year">4th Year (Senior)</option>
              <option value="Postgraduate">Postgraduate (Masters / PhD)</option>
            </select>
            <span class="form-error" id="signupYearError"></span>
          </div>

          <!-- Employee notice -->
          <div id="employeeOnlyFields" style="display:none; margin-bottom:1.25rem; padding:0.75rem; background:var(--accent-glow); border-radius:var(--radius-md); border:1px solid rgba(0,180,216,0.2);">
            <div style="font-size:0.82rem; color:var(--accent-blue); font-weight:600;">
              ℹ️ Faculty & Staff transport passes are 100% university subsidized. No fee payment required.
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Create Password *</label>
              <input type="password" class="form-control" id="signupPassword" placeholder="Minimum 6 characters" required>
              <span class="form-error" id="signupPasswordError"></span>
            </div>

            <div class="form-group">
              <label class="form-label">Confirm Password *</label>
              <input type="password" class="form-control" id="signupConfirmPassword" placeholder="Re-enter password" required>
              <span class="form-error" id="signupConfirmPasswordError"></span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" id="signupSubmitBtn" style="width: 100%; margin-top: 0.5rem;">
            Complete Registration
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.25rem; font-size: 0.88rem; color: var(--text-secondary);">
          Already have an account? <a href="login.html" style="font-weight: 600;">Sign In Here</a>
        </div>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer"></footer>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notification.js"></script>
  <script src="js/ai-assistant.js"></script>
</body>
</html>
